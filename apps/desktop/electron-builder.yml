appId: com.mingshen.harness
productName: Mingshen Harness
copyright: Copyright (c) 2026 Ming
asar: true
asarUnpack:
  - "node_modules/browserdo-mcp/**/*"
  - "node_modules/@ast-grep/**/*"
  - "node_modules/@napi-rs/**/*"
  - "node_modules/tesseract.js/**/*"
  - "node_modules/tesseract.js-core/**/*"
  - "node_modules/@tesseract.js-data/**/*"
  - "node_modules/regenerator-runtime/**/*"
  - "node_modules/is-url/**/*"
  - "node_modules/bmp-js/**/*"
  - "node_modules/wasm-feature-detect/**/*"
afterPack: ../../scripts/check-package.cjs
directories:
  output: release-artifacts
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tencentdb-memory
    to: tencentdb-memory
    filter:
      - "**/*"
  - from: resources/documents
    to: documents
    filter:
      - "*.cjs"
  - from: resources/native
    to: native
    filter:
      - "**/*"
  - from: ../../docs
    to: docs
    filter:
      - "*.md"
  - from: resources/prompts
    to: prompts
    filter:
      - "**/*"
  - from: resources/lsp
    to: lsp
    filter:
      - "**/*"
  - from: resources/sdk
    to: sdk
    filter:
      - "**/*"
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  icon: build/icon.ico
  executableName: MingshenHarness
  signAndEditExecutable: true
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mingshen Harness
  uninstallDisplayName: Mingshen Harness
artifactName: MingshenHarness-${version}-${arch}.${ext}
