<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenario explorer</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #f4f7f9;
      --panel: #ffffff;
      --text: #152126;
      --muted: #5e6b70;
      --border: #ced9de;
      --accent: #155e75;
      --focus: #0b5fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; background: var(--surface); color: var(--text); font: 16px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { display: grid; grid-template-columns: minmax(260px, 0.75fr) minmax(0, 1.5fr); gap: 24px; width: min(1040px, 100%); margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.15; }
    .dek { margin: 0 0 22px; color: var(--muted); }
    form, .result { padding: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    label:first-of-type { margin-top: 0; }
    input { width: 100%; min-height: 42px; margin-top: 6px; padding: 8px 10px; border: 1px solid #9eafb5; border-radius: 6px; background: #fff; color: var(--text); font: inherit; }
    input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    output { display: block; margin: 14px 0 4px; font-size: clamp(2rem, 7vw, 4rem); font-weight: 700; line-height: 1; }
    .unit { color: var(--muted); }
    .bar { height: 20px; margin-top: 28px; overflow: hidden; background: #e8eef0; border-radius: 4px; }
    .fill { width: 0; height: 100%; background: var(--accent); transition: width .18s ease-out; }
    .note { margin-top: 20px; color: var(--muted); }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; padding: 22px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .fill { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Replace with a transparent scenario question</h1>
      <p class="dek">Use this only when every input and calculation is explicit.</p>
      <form>
        <label for="base">Base value<input id="base" type="number" min="0" step="100" value="1000"></label>
        <label for="change">Change (%)<input id="change" type="number" min="-100" step="1" value="12"></label>
      </form>
    </section>
    <section class="result">
      <p class="unit">Result unit</p>
      <output id="result" aria-live="polite">1120</output>
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <p class="note" id="formula">Replace with the exact formula, source, and assumptions.</p>
    </section>
  </main>
  <script>
    const base = document.getElementById("base");
    const change = document.getElementById("change");
    const result = document.getElementById("result");
    const fill = document.getElementById("fill");

    function update() {
      const baseValue = Number(base.value) || 0;
      const changeValue = Number(change.value) || 0;
      const next = baseValue * (1 + changeValue / 100);
      result.textContent = next.toLocaleString(undefined, { maximumFractionDigits: 2 });
      fill.style.width = `${Math.max(0, Math.min(100, next / Math.max(baseValue, next, 1) * 100))}%`;
    }

    base.addEventListener("input", update);
    change.addEventListener("input", update);
    update();
  </script>
</body>
</html>
